name: Meta Agent OS Checks

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODEX_RUNBOOK.md"
      - "META_AGENT_BOOTSTRAP.md"
      - "README.md"
      - "INSTALL.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/**"
      - ".github/**"
      - ".claude/**"
      - "meta-agent-os/**"
      - "skills/**"
      - "scripts/**"
  push:
    branches:
      - main
      - master
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CODEX_RUNBOOK.md"
      - "META_AGENT_BOOTSTRAP.md"
      - "README.md"
      - "INSTALL.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/**"
      - ".github/**"
      - ".claude/**"
      - "meta-agent-os/**"
      - "skills/**"
      - "scripts/**"

jobs:
  check-pwsh:
    name: Hardening check (pwsh)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Meta Agent OS check
        shell: pwsh
        run: ./scripts/check-meta-agent-os.ps1 -Strict
      - name: Run Meta Agent OS check with JSON output
        shell: pwsh
        run: ./scripts/check-meta-agent-os.ps1 -Strict -Json

      - name: Exercise the ROI calculator against the fixture
        shell: pwsh
        run: |
          python scripts/roi-calculator.py docs/examples/roi/EXAMPLE_WORKFLOW.json `
            --pricing docs/examples/roi/EXAMPLE_PRICING.json --today 2026-08-04

      - name: ROI calculator must refuse the empty default registry
        shell: pwsh
        run: |
          python scripts/roi-calculator.py docs/examples/roi/EXAMPLE_WORKFLOW.json
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Calculator produced a number from an empty pricing registry."
            exit 1
          }
          exit 0

      - name: Exercise the agent suitability gate
        shell: pwsh
        run: python scripts/agent-suitability.py docs/examples/safety/EXAMPLE_ASSESSMENT.json

  check-bash:
    name: Hardening check (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Meta Agent OS check
        run: |
          chmod +x ./scripts/check-meta-agent-os.sh
          ./scripts/check-meta-agent-os.sh --strict
      - name: Run Meta Agent OS check with JSON output
        run: ./scripts/check-meta-agent-os.sh --strict --json

      - name: Exercise the ROI calculator against the fixture
        run: |
          python3 scripts/roi-calculator.py docs/examples/roi/EXAMPLE_WORKFLOW.json             --pricing docs/examples/roi/EXAMPLE_PRICING.json --today 2026-08-04

      - name: ROI calculator must refuse the empty default registry
        run: |
          if python3 scripts/roi-calculator.py docs/examples/roi/EXAMPLE_WORKFLOW.json; then
            echo "Calculator produced a number from an empty pricing registry." >&2
            exit 1
          fi

      - name: Exercise the agent suitability gate
        run: python3 scripts/agent-suitability.py docs/examples/safety/EXAMPLE_ASSESSMENT.json

      - name: Suitability gate must block a failed gate condition
        run: |
          python3 - <<'EOF'
          import json, pathlib
          a = json.loads(pathlib.Path("docs/examples/safety/EXAMPLE_ASSESSMENT.json").read_text())
          a["gate"]["requires_judgement"] = {"holds": False, "reason": "CI negative test."}
          pathlib.Path("/tmp/blocked.json").write_text(json.dumps(a))
          EOF
          if python3 scripts/agent-suitability.py /tmp/blocked.json; then
            echo "Suitability gate failed to block a failed gate condition." >&2
            exit 1
          fi
